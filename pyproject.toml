[project]
name = "agentpractice"
version = "0.1.0"
description = "A hands-on exercise showing how models, agents, skills, tools, and MCP fit together"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.11,<3",
]

[project.scripts]
agent-practice = "agent_practice.cli:main"
agent-practice-mcp = "agent_practice.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
